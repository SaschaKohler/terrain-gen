<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TerraForge</title>
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #eee;
      }
      #root {
        display: flex;
        width: 100vw;
        height: 100vh;
      }
      #viewport {
        display: block;
        flex: 1 1 auto;
        min-width: 0;
        height: 100vh;
      }
      #ui {
        flex: 0 0 280px;
        height: 100vh;
        overflow-y: auto;
        overflow-x: hidden;
        background: #1a1a1a;
        border-left: 1px solid #333;
      }
      #ui-panel {
        padding: 16px;
        min-width: 0;
      }
      #ui-panel h2 {
        margin: 0 0 16px;
        font-size: 18px;
        color: #fff;
      }
      #ui-panel h3 {
        margin: 16px 0 8px;
        font-size: 13px;
        text-transform: uppercase;
        color: #aaa;
        border-bottom: 1px solid #333;
        padding-bottom: 4px;
      }
      #ui-panel section:first-of-type h3 {
        margin-top: 0;
      }
      .param-row {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        min-width: 0;
      }
      .param-row label {
        flex: 0 0 80px;
        font-size: 12px;
        color: #ccc;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .param-row input[type='range'] {
        flex: 1;
        min-width: 0;
      }
      .param-row input[type='number'] {
        width: 52px;
        flex: 0 0 52px;
        background: #111;
        color: #eee;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 4px;
        font-size: 12px;
      }
      .actions {
        margin-top: 16px;
      }
      #regenerate {
        width: 100%;
        padding: 10px;
        background: #2d6cdf;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
      }
      #regenerate:hover {
        background: #3e7ff0;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <canvas id="viewport"></canvas>
      <div id="ui"></div>
    </div>
    <script type="module" src="/editor/main.ts"></script>
  </body>
</html>
